<!-- wp:html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#fff;--ink:#1d2a44;--primary:#1F4E9C;--accent:#E5232D;--mute:#626b7b;--border:#d7dce3;--soft:#f4f6f9;
 --f:'Hiragino Sans','Noto Sans JP',sans-serif;
 --serif:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:24px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;font-weight:400;line-height:1.9;overflow-wrap:anywhere}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
b,strong{font-weight:700}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:4px}
.wrap{width:100%;max-width:760px;min-width:0;margin-inline:auto;padding-inline:20px}
.brand-header{background:var(--paper);padding-top:env(safe-area-inset-top)}
.brand-header::after{content:'';display:block;height:2px;background:linear-gradient(to right,var(--primary) 0 82%,var(--accent) 82% 100%)}
.brand{position:static;display:flex;align-items:center;min-height:70px;padding-block:20px}
.brand img{width:auto;height:30px}
main,footer,.hero{position:relative;z-index:1}
.hero{padding-block:0}
.kicker{display:block;padding:11px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px;font-weight:500;line-height:1.85;letter-spacing:.025em;color:var(--mute)}
h1{font-family:var(--serif);font-size:clamp(26px,7vw,40px);font-weight:700;line-height:1.7;margin-top:29px;letter-spacing:.015em}
h1 em{font-style:normal;color:var(--ink)}
.lede{max-width:31em;margin:21px auto 0;font-size:16px;font-weight:400;color:#424c61;line-height:2;text-align:left;text-wrap:pretty}
.lede b{font-weight:600;color:var(--ink)}
.down{margin:24px 0 0;font-size:15px;font-weight:500;color:var(--mute);letter-spacing:.035em}
#quiz{padding-top:28px}
section{padding-block:36px 32px;position:relative;z-index:1}
.bar{height:3px;background:#e5e8ed;overflow:hidden;margin-bottom:23px}
.bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.qn{display:inline-block;font-size:14px;font-weight:500;color:var(--primary);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.q{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.75;margin:10px 0 21px;max-width:27em;text-wrap:pretty}
.opts{display:grid;gap:10px;counter-reset:choice}
.opt{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) 8px;column-gap:12px;align-items:center;width:100%;min-width:0;min-height:62px;border:1px solid var(--border);border-radius:4px;padding:16px;background:var(--paper);font-family:var(--f);font-size:17px;font-weight:500;color:var(--ink);text-align:left;cursor:pointer;line-height:1.65;overflow-wrap:anywhere;counter-increment:choice;appearance:none;transition:border-color .16s,background-color .16s}
.opt::before{content:counter(choice,decimal-leading-zero);grid-column:1;grid-row:1;align-self:center;font-size:12px;font-weight:400;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--mute)}
.opt span{grid-column:2;grid-row:1;min-width:0}
.opt::after{content:'';grid-column:3;grid-row:1;width:7px;height:7px;border-top:1px solid var(--primary);border-right:1px solid var(--ink);transform:rotate(45deg)}
.opt:has(small){min-height:88px}
.opt:has(small)::before,.opt:has(small)::after{grid-row:1 / 3}
.opt:has(small) span{align-self:end}
.opt small{grid-column:2;grid-row:2;min-width:0;display:block;font-size:15px;font-weight:400;color:var(--mute);margin-top:4px;align-self:start;line-height:1.7}
.opt:active,.opt:focus-visible{background:var(--soft);border-color:var(--primary)}
.back{min-height:44px;margin-top:19px;padding:8px 4px;background:none;border:0;color:var(--mute);font-family:var(--f);font-size:15px;font-weight:400;cursor:pointer;text-decoration:underline;text-underline-offset:5px}
.load{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.spin{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--primary);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.load-t{font-size:17px;font-weight:500;line-height:1.8}
.load-s{font-size:15px;font-weight:400;color:var(--mute)}
.res-head{text-align:center}
.res-head .t{padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:15px;font-weight:400;color:var(--mute);line-height:1.85}
.res-head .m{font-family:var(--serif);font-size:clamp(23px,6vw,32px);font-weight:700;line-height:1.8;margin-top:28px;letter-spacing:.015em}
.res-head .m span{color:var(--primary)}
.unis{margin:28px 0 0;display:grid;border-top:1px solid var(--primary)}
.uni{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--paper);border-bottom:1px solid var(--border);padding:20px 12px;min-width:0;min-height:80px}
.uni .r{font-size:16px;font-weight:500;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.uni .n{min-width:0;font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.65}
.uni .fac{display:block;font-family:var(--f);font-size:14px;font-weight:500;color:var(--primary);line-height:1.5;margin-top:2px}
.uni .c{font-size:15px;font-weight:400;color:var(--mute);white-space:nowrap}
.uni .c b{color:var(--primary);font-size:25px;font-weight:600;margin-right:3px;font-variant-numeric:tabular-nums}
.uni:first-child{background:var(--soft)}
.uni:first-child .r,.uni:first-child .c b{color:var(--primary)}
.note{margin-top:15px;font-size:15px;font-weight:400;color:var(--mute);line-height:1.85}
#check{margin:36px 0 0}
.ck-h{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 20px;line-height:1.9}
.ck-h em{font-style:normal;color:var(--primary)}
.ck{background:var(--paper);border:1px solid var(--border);border-radius:4px;padding:18px 14px 12px;margin:0 0 20px;min-width:0}
.ck-t{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;min-width:0}
.ck-u{min-width:0;font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.65}
.ck-k{font-size:15px;color:var(--mute);line-height:1.8}
.ck-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:16px 0 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ck-b{min-width:0;padding:14px 3px;text-align:center;font-size:15px;line-height:1.7;background:var(--paper);color:var(--ink)}
.ck-b+.ck-b{border-left:1px solid var(--border)}
.ck-b b{color:var(--primary);display:block;margin-bottom:4px;font-size:32px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.ck-ok{background:var(--soft)}
.ck-mid{color:var(--accent)}
.ck-ng{color:var(--mute)}
.ck-ex{list-style:none;padding:0;margin:0;font-size:16px;line-height:1.85}
.ck-ex li{padding:13px 0;border-bottom:1px solid var(--border)}
.ck-ex li span{font-weight:500;margin-right:5px}
.ck-ex .o{color:var(--primary)}
.ck-ex .m{color:var(--accent)}
.ck-ex small{display:inline-block;margin-top:5px;font-size:15px;line-height:1.8;color:var(--mute)}
.ck-lk{display:inline-flex;align-items:center;min-height:44px;max-width:100%;font-size:15px;color:var(--primary);margin-top:6px;padding-block:9px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.ck-gpa{font-size:15px;color:#424c61;background:var(--soft);border-left:2px solid var(--primary);padding:12px;margin:12px 0;line-height:1.85}
.ck-next{background:var(--paper);color:var(--ink);padding:28px 0 0;margin:36px 0 0;border-top:1px solid var(--primary);text-align:left}
.ck-n1{font-family:var(--serif);font-size:23px;font-weight:600;margin:0 0 14px;line-height:1.8}
.ck-n2{font-size:17px;margin:0 0 14px;line-height:1.9}
.ck-n2 b{color:var(--primary);font-weight:600}
.ck-n3{font-size:15px;color:var(--mute);margin:0;line-height:1.9}
.ck-gifts{background:var(--paper);color:var(--ink);padding:24px 0 0;margin:26px 0 0;border-top:1px solid var(--border);text-align:left}
.ck-gh{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 0 13px;line-height:1.8}
.ck-g{position:relative;display:block;border:0;border-bottom:1px solid var(--border);padding:16px 24px 16px 0;margin:0;color:var(--ink);text-decoration:none;line-height:1.8;transition:background-color .16s}
.ck-g::after{content:'';position:absolute;right:6px;top:50%;width:7px;height:7px;border-top:1px solid var(--primary);border-right:1px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.ck-g b{display:block;font-size:16px;font-weight:600}
.ck-g span{display:block;margin-top:4px;font-size:15px;color:var(--mute)}
.ck-src{font-size:15px;color:var(--mute);margin:24px 0 0;line-height:1.9;text-align:left}
.btn{position:relative;display:block;width:100%;max-width:100%;border:1px solid var(--primary);cursor:pointer;font-family:var(--f);text-decoration:none;text-align:center;border-radius:4px;line-height:1.7;padding:17px 38px;transition:background-color .16s,border-color .16s}
.btn .big{display:block;font-size:20px;font-weight:600;letter-spacing:.02em}
.btn .sub{display:block;font-size:15px;font-weight:400;margin-top:4px}
.btn::after{content:'';position:absolute;right:19px;top:50%;width:8px;height:8px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:translateY(-50%) rotate(45deg)}
.btn-y,.btn-l{margin-top:28px;min-height:82px;background:var(--primary);color:#fff}
.btn:active{background:#173d7d;border-color:#173d7d}
.cta2{margin-top:24px}
.cta2 .big{font-size:18px}
.free{margin-top:18px;font-size:15px;font-weight:400;color:var(--mute);text-align:left;line-height:1.9}
.hint{margin:24px auto 0;padding:0;list-style:none;text-align:left;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.hint li{padding:13px 0;font-size:16px;font-weight:400;line-height:1.85}
.hint li+li{border-top:1px solid var(--border)}
.gift{margin-top:36px;background:var(--paper);border-top:1px solid var(--primary);padding:25px 0;text-align:left}
.gift .lb{display:inline-block;color:var(--primary);font-size:15px;font-weight:500;letter-spacing:.03em}
.gift h3{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.85;margin-top:16px;text-wrap:pretty}
.gift h3 span{color:var(--primary)}
.gift .say{margin-top:18px;font-size:16px;font-weight:400;color:#424c61;line-height:1.95}
.shot{margin:24px auto 0;width:100%;max-width:470px;height:auto}
.spec{margin:24px 0 0;padding:0;list-style:none;text-align:left;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.spec li{padding:14px 0;font-size:16px;font-weight:400;color:#424c61;line-height:1.85}
.spec li+li{border-top:1px solid var(--border)}
.spec li b{color:var(--ink);font-weight:600}
.why{margin-top:32px;padding:24px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.why h3,.sem h3{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.8}
.why ul{margin:15px 0 0;padding-left:1.2em;display:grid;gap:12px}
.why li{font-size:16px;font-weight:400;color:#424c61;line-height:1.85}
.why li b{font-weight:600;color:var(--ink)}
.sem{margin-top:28px;background:var(--paper);color:var(--ink);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:24px 0}
.sem .lb{display:inline-block;color:var(--primary);font-size:15px;font-weight:500}
.sem h3{margin-top:12px}
.sem .date{margin-top:16px;background:var(--soft);border-radius:4px;padding:14px;font-size:15px;line-height:1.9}
.sem .date b{font-size:21px;font-weight:600}
.sem p{margin-top:14px;font-size:16px;font-weight:400;line-height:1.9;color:var(--mute)}
.who{margin-top:32px;padding-top:24px;border-top:1px solid var(--border);font-size:15px;font-weight:400;color:var(--mute);line-height:1.95}
.who b{display:block;margin-bottom:8px;color:var(--ink);font-size:16px;font-weight:600}
.who small{display:block;margin-top:10px;font-size:15px;line-height:1.85}
.again{margin-top:20px;text-align:center}
footer{padding-block:24px max(32px,env(safe-area-inset-bottom));font-size:15px;font-weight:400;color:var(--mute);line-height:1.9;text-align:center}
footer p+p{margin-top:7px}
[hidden]{display:none!important}
@media(hover:hover){
 .opt:hover{border-color:var(--primary);background:var(--soft)}
 .btn:hover{background:#173d7d;border-color:#173d7d}
 .ck-g:hover{background:var(--soft)}
 .ck-lk:hover,.back:hover{color:var(--primary)}
}
@media(min-width:600px){
 .wrap{padding-inline:40px}
 .kicker{font-size:15px;padding-block:13px}
 h1{margin-top:34px}
 .lede{font-size:17px;margin-top:25px}
 .down{margin-top:28px}
 #quiz{padding-top:34px}
 .q{font-family:var(--serif);font-size:25px;margin-bottom:24px}
 .opt{padding:18px 22px;font-size:18px;column-gap:16px;min-height:68px}
 .opt:has(small){min-height:94px}
 .res-head .m{margin-top:32px}
 .uni{padding:22px;grid-template-columns:32px minmax(0,1fr) auto;gap:20px}
 .uni .n{font-size:27px}
 .uni .c b{font-size:28px}
 .ck{padding:24px 24px 16px;margin-bottom:24px}
 .ck-h{font-size:23px}
 .ck-u{font-size:27px}
 .ck-b{padding-block:18px;font-size:16px}
 .ck-b b{font-size:36px}
 .ck-next{margin-top:42px;padding-top:32px}
 .ck-n1{font-size:27px}
 .ck-gifts{margin-top:30px;padding-top:28px}
 .ck-gh{font-size:22px}
 .btn{max-width:540px;margin-inline:auto}
 .gift h3{font-size:27px}
}
@media(max-width:374px){
 .wrap{padding-inline:16px}
 h1{font-size:24px;letter-spacing:0}
 .uni{gap:8px;padding-inline:8px;grid-template-columns:20px minmax(0,1fr) auto}
 .uni .n{font-size:20px}
 .ck{padding-inline:10px}
 .ck-b{padding-inline:1px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
 .spin{animation-duration:2.4s}
}
</style>

  <div class="brand wrap"><img src="https://lp.rizapuro.co.jp/wp-content/uploads/2026/09/logo.png" alt="リザプロ"></div>

<header class="wrap hero" id="hero"></header>

<main>

function cond(r){const a=[];if(r.g!=null)a.push('評定'+r.g.toFixed(1)+'以上');if(r.el)a.push('英検®'+r.el+'以上');return a.length?a.join('・'):'評定・英検®の条件は掲載なし（募集要項で確認）';}
function renderCheck(names){
 const g=GPAV[A.gpa], e=EKV[A.eiken]||0, kw=FIELDKW[A.field];
 let h='<p class="ck-h">この3校に、<em>今の評定・英検®で出願できるか</em>を照らしました</p>';
 if(g==null) h+='<p class="ck-gpa">評定が「わからない」の場合は、評定の条件がある方式を「あと少し」にしています。学校の通知表で確かめると、もっと正確になります。</p>';
 names.forEach(function(u){
  let L=(CHECK[u]||[]); const F=kw?L.filter(r=>kw.test(r.f+r.d)):L; let wide=false; if(F.length>=1?F.some(r=>judge(r,g,e)==='o'):false){L=F;}else{wide=kw?F.length<L.length:false;}
  const J=L.map(r=>Object.assign({j:judge(r,g,e)},r));
  const o=J.filter(r=>r.j==='o'), m=J.filter(r=>r.j==='m'), x=J.filter(r=>r.j==='x');
  const ex=o.slice(0,3).concat(m.slice(0,Math.max(0,3-o.slice(0,3).length)));
  const url=(o[0]||m[0]||L[0]||{}).url;
  h+='<div class="ck"><div class="ck-t"><span class="ck-u">'+u+'</span><span class="ck-k">公募の推薦・総合型 '+L.length+'件</span></div>'+
   '<div class="ck-row"><div class="ck-b ck-ok"><b>'+o.length+'</b>出願できそう</div><div class="ck-b ck-mid"><b>'+m.length+'</b>あと少し</div><div class="ck-b ck-ng"><b>'+x.length+'</b>今は届かない</div></div>'+
   (wide?'<p class="ck-gpa">この分野の公募推薦が少ない大学なので、ほかの学部も含めています。</p>':'')+'<ul class="ck-ex">'+ex.map(r=>'<li><span class="'+(r.j==='o'?'o':'m')+'">'+(r.j==='o'?'◯':'△')+'</span>'+r.f+((r.d?r.d!==r.f:false)?' '+r.d:'')+'｜'+r.a+'<br><small>'+cond(r)+'</small></li>').join('')+'</ul>'+
   (url?'<a class="ck-lk" href="'+url+'" target="_blank" rel="noopener">未来図で入試方式をくわしく見る ›</a>':'')+'</div>';
 });
 $('check').innerHTML=h;
 T('check',{ok:names.map(u=>u).join('・')});
}
function show(){
 $('hero').hidden=true; $('quiz').hidden=true; $('loading').hidden=false;
 window.scrollTo({top:0,behavior:'smooth'});
 const msgs=['12校のデータを検索しています',
             A.label+'の近い先輩を絞り込んでいます',
             '評定と英検®の条件を照合しています'];
 let i=0; $('loadmsg').textContent=msgs[0];
 const t=setInterval(()=>{i++; if(i<msgs.length)$('loadmsg').textContent=msgs[i];},700);
 setTimeout(()=>{clearInterval(t); $('loading').hidden=true; reveal();},2200);
}
function reveal(){
 const cell=LOOKUP[A.field+'|'+A.gpa+'|'+A.eiken], label=A.label;
 const names=cell.top.map(t=>t.u);
 $('result').hidden=false;
 $('rcond').textContent=label+'／評定'+(A.gpa==='わからない'?'未回答':A.gpa)+'／英検®'+(A.eiken==='なし'?'なし':A.eiken);
 $('rmain').innerHTML='目指せる大学・学部は<br><span>この3校</span>';
 $('unis').innerHTML=cell.top.map((t,i)=>
  '<div class="uni"><div class="r">'+(i+1)+'</div><div class="n">'+t.u+(((t.f?t.f.length:0)>0)?'<span class="fac">'+t.f.join('・')+'</span>':'')+'</div>'+
  '<div class="c"><b>'+t.n+'</b>件</div></div>').join('');
 $('rnote').textContent='早慶上智・GMARCH・関関同立・主要国公立の合格者のうち、'+(cell.same?'同じ':'近い')+'条件の '+cell.n+'人の実績から集計しています。';
 const fit=names.indexOf(BEST[A.field]);
 const short=names.map(n=>n.replace('大学','').replace('慶應義塾','慶應'));
 $('gifthead').innerHTML= fit>=0
  ? '<span>'+short.join('・')+'</span> に<br><span>'+label+'</span> で合格した人の志望理由書を、<br>そのままお渡しします'
  : '<span>'+label+'</span> で合格した人の<br>志望理由書を、そのままお渡しします';
 $('sp1').innerHTML='あなたに出た <b>'+short.join('・')+'</b> の合格者の志望理由書';
 A.top3=short.join('・');
 $('cta').href=ctaURL();
 T('result');
 $('giftbody').textContent=EFFORT_LINE[A.effort]+
  '何を書けば受かるのかは、受かった人の文章を読むのがいちばん早いです。合格者が動き出したのは高2の9月。その9月がいまです。';
 window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('pagehide',function(){T('leave');});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')T('leave');});
T('view');
$('quiz').hidden=false;render();var _st=false;document.addEventListener('click',function(e){if(_st)return;var o=(e.target?e.target.closest:null)?e.target.closest('.opt'):null;if(o){_st=true;T('start');}},true);
[$('cta'),$('cta2')].filter(Boolean).forEach(function(el){el.addEventListener('click',()=>{T('line');try{if(typeof fbq==='function'){fbq('trackCustom','LineButtonClick',{content_name:'診断LP_大学診断',content_category:'LINE友だち追加',value:0,currency:'JPY'},{eventID:'Lead-'+Date.now()+'-'+Math.random().toString(36).slice(2,10)});}}catch(e){}});});
$('back').onclick=()=>{step=Math.max(0,step-1);render();};
$('again').onclick=()=>{step=0;$('result').hidden=true;$('loading').hidden=true;$('quiz').hidden=false;render();};
</script>
