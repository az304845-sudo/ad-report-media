<script>(function(){try{var q=location.search||'';var f=/[?&]rzpday=([12])/.exec(q);var d=new Date(Date.now()+324e5);var today=d.getUTCFullYear()===2026?(d.getUTCMonth()===9?d.getUTCDate()===21:false):false;if(f){today=true;}if(!today)return;var late=f?f[1]==='2':d.getUTCHours()>=20;var SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,NOSCRIPT:1};function fix(root){try{var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);var n;while((n=w.nextNode())){var p=n.parentNode;if(p){if(SKIP[p.nodeName])continue;}var v=n.nodeValue;if(v.indexOf('10/21')<0)continue;var nv=v.replace(/10\/21(?![0-9])/g,'本日21日');if(nv!==v){n.nodeValue=nv;}}}catch(_){}}function bar(){if(document.getElementById('rzp-today'))return;var b=document.createElement('div');b.id='rzp-today';b.style.cssText='position:relative;z-index:50;margin:0;padding:9px 12px;background:#E8336C;color:#fff;text-align:center;font-size:14px;line-height:1.55;font-weight:800;letter-spacing:0;text-shadow:none';b.innerHTML=late?"本日21日（水）の推薦入試勉強会は、20:00に始まりました。<br>次回の日程は、LINEでお知らせします。":"<b style='color:#FFE16A'>本日21日（水）20:00〜</b> 推薦入試勉強会<br>オンライン・参加無料｜<b style='color:#FFE16A'>まだ間に合います</b>";document.body.insertBefore(b,document.body.firstChild);}function go(){bar();fix(document.body);try{new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){var m=ms[i];if(m.type==='characterData'){var t=m.target;if(t.nodeValue){if(t.nodeValue.indexOf('10/21')>=0){fix(t.parentNode||document.body);}}}else{for(var j=0;j<m.addedNodes.length;j++){var a=m.addedNodes[j];if(a.nodeType===1){fix(a);}else if(a.nodeType===3){fix(a.parentNode||document.body);}}}}}).observe(document.body,{subtree:true,childList:true,characterData:true});}catch(_){}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',go);}else{go();}}catch(_){}})();</script>
